server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compresión de texto (html va por defecto al activar gzip)
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml text/markdown text/plain application/xml;

    # Caché del navegador: CSS/JS van versionados con ?v=; medios con una semana
    location ~* \.(?:css|js)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
    location ~* \.(?:webp|jpe?g|png|svg|ico|mp4|webm|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Fix: 404 real con cuerpo propio (mapa del sitio, llms.txt, sitemap.xml)
    # en vez del 404 en blanco por defecto de nginx.
    error_page 404 /404.html;
    location = /404.html {
        internal;
        default_type text/html;
    }

    # Fix: negociación de contenido Accept: text/markdown en la home.
    # Para agregar más páginas a la negociación, crea su gemelo <ruta>.md
    # junto al .html y repite este mismo patrón de bloques.
    location = / {
        add_header Vary "Accept, Accept-Encoding" always;
        if ($http_accept ~* "text/markdown") {
            rewrite ^ /index.md last;
        }
        try_files /index.html =404;
    }

    location = /index.md {
        add_header Vary "Accept, Accept-Encoding" always;
        default_type "text/markdown; charset=utf-8";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
